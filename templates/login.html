<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SuriBot — Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static',filename='styles/login.css') }}" />
  </head>
<body>
 
  <!-- Background -->
  <div class="bg" aria-hidden="true">
    <div class="bg__grid"></div>
    <div class="bg__orb bg__orb--1"></div>
    <div class="bg__orb bg__orb--2"></div>
    <div class="bg__orb bg__orb--3"></div>
  </div>
 
  <!-- Login card -->
  <div class="card" role="main">
 
    <!-- Brand -->
    <div class="brand">
      <div class="brand__icon" aria-hidden="true">✦</div>
      <div>
        <div class="brand__name">SuriBot</div>
        <div class="brand__sub">Admin Dashboard</div>
      </div>
    </div>
 
    <!-- Heading -->
    <div class="heading">
      <div class="heading__title">Welcome back</div>
      <div class="heading__sub">Sign in to manage your knowledge base and analytics.</div>
    </div>
 
    <!-- Error banner -->
    <div class="error-banner" id="error-banner" role="alert" aria-live="polite">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="error-text">Invalid email or password.</span>
    </div>
 
    <!-- Form -->
    <form class="form" id="login-form" novalidate>
 
      <!-- Username -->
      <div class="field">
        <label class="field__label" for="username">Username</label>
        <div class="field__wrap">
          <span class="field__icon" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
          </span>
          <input
            class="field__input"
            id="username"
            type="text"
            name="username"
            placeholder="admin"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            required
          />
        </div>
      </div>
 
      <!-- Password -->
      <div class="field">
        <label class="field__label" for="password">Password</label>
        <div class="field__wrap">
          <span class="field__icon" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input
            class="field__input"
            id="password"
            type="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
          <button class="field__toggle" type="button" id="pw-toggle" aria-label="Show password" title="Show password">
            <svg id="eye-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
 
      <!-- Submit -->
      <button class="btn-submit" type="submit" id="submit-btn">
        <span class="btn-submit__text">Sign in to Dashboard</span>
        <span class="btn-submit__spinner" aria-hidden="true">
          <span class="spinner-ring"></span>
        </span>
      </button>
 
    </form>
 
    <!-- Footer -->
    <div class="card__footer" style="justify-content:center;">
      <div class="footer__copy">Suri Marketing © 2025</div>
    </div>
 
  </div>

  <script type="module" src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
